<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Delivery - Al Sheeri's</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body { font-family: 'Inter', sans-serif; background: #f3f4f6; min-height: 100vh; }
      .header { background: #1f2937; color: #fff; padding: 1rem 1.5rem; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 10; }
      .header h1 { font-size: 1.125rem; font-weight: 700; }
      .header a { color: #fff; text-decoration: none; font-size: 0.8rem; }
      .container { max-width: 600px; margin: 0 auto; padding: 1.5rem; }
      .order-card { background: #fff; border-radius: 1rem; border: 1px solid #e5e7eb; margin-bottom: 1rem; overflow: hidden; }
      .order-header { padding: 1rem 1.25rem; border-bottom: 1px solid #f3f4f6; display: flex; justify-content: space-between; align-items: center; }
      .order-id { font-weight: 700; font-size: 0.875rem; }
      .status { font-size: 0.7rem; font-weight: 600; padding: 0.25rem 0.6rem; border-radius: 999px; }
      .status-preparing { background: #dbeafe; color: #1e40af; }
      .status-out { background: #ede9fe; color: #5b21b6; }
      .order-body { padding: 1.25rem; }
      .customer-name { font-weight: 700; font-size: 0.95rem; margin-bottom: 0.25rem; }
      .customer-phone { font-size: 0.85rem; color: #374151; margin-bottom: 0.75rem; }
      .customer-phone a { color: #2563eb; text-decoration: none; font-weight: 600; }
      .address { font-size: 0.8rem; color: #4b5563; line-height: 1.5; margin-bottom: 1rem; padding: 0.75rem; background: #f9fafb; border-radius: 0.5rem; border: 1px solid #e5e7eb; }
      .items { font-size: 0.8rem; color: #6b7280; margin-bottom: 1rem; }
      .total { font-weight: 700; font-size: 0.95rem; margin-bottom: 1rem; }
      .actions { display: flex; gap: 0.5rem; flex-wrap: wrap; }
      .btn { padding: 0.6rem 1.25rem; border-radius: 0.5rem; border: none; font-size: 0.8rem; font-weight: 600; cursor: pointer; font-family: 'Inter', sans-serif; text-decoration: none; display: inline-flex; align-items: center; gap: 0.4rem; }
      .btn-map { background: #3b82f6; color: #fff; }
      .btn-call { background: #10b981; color: #fff; }
      .btn-delivered { background: #111827; color: #fff; }
      .btn:hover { opacity: 0.9; }
      .empty { text-align: center; padding: 4rem 1rem; color: #9ca3af; }
      .empty p { font-size: 1rem; margin-bottom: 0.5rem; }
      .refresh { text-align: center; font-size: 0.7rem; color: #9ca3af; margin-top: 1rem; }
    </style>
    <script type="module" crossorigin src="/assets/delivery-BqQNY5Ie.js"></script>
    <link rel="modulepreload" crossorigin href="/assets/modulepreload-polyfill-B5Qt9EMX.js">
  </head>
  <body>
    <div class="header">
      <h1>🛵 Delivery Dashboard</h1>
      <a href="/admin.html">Admin →</a>
    </div>

    <div class="container">
      <div id="delivery-list"></div>
      <p class="refresh">Auto-refreshes every 3 seconds</p>
    </div>

  </body>
</html>
