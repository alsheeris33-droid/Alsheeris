<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Menu QR Code - Al Sheeri's</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body { font-family: 'Inter', sans-serif; background: #f3f4f6; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 2rem; }
      .header { text-align: center; margin-bottom: 2rem; }
      .header h1 { font-size: 1.5rem; font-weight: 800; color: #111; }
      .header p { color: #6b7280; font-size: 0.875rem; margin-top: 0.25rem; }
      .controls { background: #fff; border-radius: 1rem; padding: 1.5rem; border: 1px solid #e5e7eb; margin-bottom: 2rem; width: 100%; max-width: 500px; }
      .controls label { display: block; font-size: 0.8rem; font-weight: 600; color: #374151; margin-bottom: 0.4rem; }
      .controls input { width: 100%; padding: 0.6rem 0.875rem; border: 1px solid #d1d5db; border-radius: 0.5rem; font-size: 0.875rem; font-family: 'Inter', sans-serif; outline: none; margin-bottom: 1rem; }
      .controls input:focus { border-color: #111827; }
      .btn { width: 100%; padding: 0.75rem; background: #1f2937; color: #fff; font-size: 0.875rem; font-weight: 600; border: none; border-radius: 0.5rem; cursor: pointer; font-family: 'Inter', sans-serif; }
      .btn:hover { background: #374151; }
      .btn-print { background: #111827; margin-top: 0.5rem; }
      .btn-print:hover { background: #1f2937; }
      .qr-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 1.5rem; width: 100%; max-width: 900px; }
      .qr-card { background: #fff; border-radius: 1rem; padding: 1.5rem; border: 1px solid #e5e7eb; text-align: center; }
      .qr-card .table-name { font-size: 1rem; font-weight: 700; color: #111; margin-bottom: 1rem; }
      .qr-card .qr-code { display: flex; justify-content: center; margin-bottom: 1rem; }
      .qr-card .restaurant-name { font-size: 0.75rem; color: #6b7280; }
      .qr-card .scan-text { font-size: 0.7rem; color: #9ca3af; margin-top: 0.25rem; }
      @media print {
        body { background: #fff; padding: 0; }
        .controls, .header, .no-print { display: none; }
        .qr-grid { grid-template-columns: repeat(2, 1fr); gap: 1rem; }
        .qr-card { border: 2px solid #e5e7eb; page-break-inside: avoid; }
      }
    </style>
  </head>
  <body>
    <div class="no-print">
      <div class="header">
        <h1>Menu QR Code Generator</h1>
        <p>Generate QR codes for each dining table</p>
      </div>

      <div class="controls">
        <label>Restaurant Website URL</label>
        <input type="text" id="site-url" placeholder="https://alsheeris.in/menu.html" value="https://alsheeris.in/menu.html"/>
        <label>Number of Tables</label>
        <input type="number" id="table-count" value="10" min="1" max="50"/>
        <label>Table Name Prefix (e.g. "Table" → Table 1, Table 2...)</label>
        <input type="text" id="table-prefix" value="Table"/>
        <button class="btn" onclick="generateQRCodes()">Generate QR Codes</button>
        <button class="btn btn-print" onclick="window.print()">Print All QR Codes</button>
      </div>
    </div>

    <div class="qr-grid" id="qr-grid"></div>

    <script>
      function generateQRCodes() {
        const siteUrl = document.getElementById("site-url").value.trim();
        const tableCount = parseInt(document.getElementById("table-count").value) || 10;
        const prefix = document.getElementById("table-prefix").value.trim() || "Table";
        const grid = document.getElementById("qr-grid");
        grid.innerHTML = "";

        for (let i = 1; i <= tableCount; i++) {
          const tableName = prefix + " " + i;
          // URL includes table number as a param (for future use like dine-in orders)
          const tableUrl = siteUrl + "?table=" + i;

          const card = document.createElement("div");
          card.className = "qr-card";
          card.innerHTML = `
            <div class="table-name">${tableName}</div>
            <div class="qr-code" id="qr-${i}"></div>
            <div class="restaurant-name">Al Sheeri's</div>
            <div class="scan-text">Scan to view menu & order</div>
          `;
          grid.appendChild(card);

          // Generate QR code
          new QRCode(document.getElementById("qr-" + i), {
            text: tableUrl,
            width: 150,
            height: 150,
            colorDark: "#1f2937",
            colorLight: "#ffffff",
            correctLevel: QRCode.CorrectLevel.H
          });
        }
      }

      // Auto-generate on load
      generateQRCodes();
    </script>
  </body>
</html>
