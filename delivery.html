<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Delivery - Al Sheeri's</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body { font-family: 'Inter', sans-serif; background: #f3f4f6; min-height: 100vh; }
      .header { background: #1f2937; color: #fff; padding: 1rem 1.5rem; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 10; }
      .header h1 { font-size: 1.125rem; font-weight: 700; }
      .header a { color: #fff; text-decoration: none; font-size: 0.8rem; }
      .container { max-width: 600px; margin: 0 auto; padding: 1.5rem; }
      .order-card { background: #fff; border-radius: 1rem; border: 1px solid #e5e7eb; margin-bottom: 1rem; overflow: hidden; }
      .order-header { padding: 1rem 1.25rem; border-bottom: 1px solid #f3f4f6; display: flex; justify-content: space-between; align-items: center; }
      .order-id { font-weight: 700; font-size: 0.875rem; }
      .status { font-size: 0.7rem; font-weight: 600; padding: 0.25rem 0.6rem; border-radius: 999px; }
      .status-preparing { background: #dbeafe; color: #1e40af; }
      .status-out { background: #ede9fe; color: #5b21b6; }
      .order-body { padding: 1.25rem; }
      .customer-name { font-weight: 700; font-size: 0.95rem; margin-bottom: 0.25rem; }
      .customer-phone { font-size: 0.85rem; color: #374151; margin-bottom: 0.75rem; }
      .customer-phone a { color: #2563eb; text-decoration: none; font-weight: 600; }
      .address { font-size: 0.8rem; color: #4b5563; line-height: 1.5; margin-bottom: 1rem; padding: 0.75rem; background: #f9fafb; border-radius: 0.5rem; border: 1px solid #e5e7eb; }
      .items { font-size: 0.8rem; color: #6b7280; margin-bottom: 1rem; }
      .total { font-weight: 700; font-size: 0.95rem; margin-bottom: 1rem; }
      .actions { display: flex; gap: 0.5rem; flex-wrap: wrap; }
      .btn { padding: 0.6rem 1.25rem; border-radius: 0.5rem; border: none; font-size: 0.8rem; font-weight: 600; cursor: pointer; font-family: 'Inter', sans-serif; text-decoration: none; display: inline-flex; align-items: center; gap: 0.4rem; }
      .btn-map { background: #3b82f6; color: #fff; }
      .btn-call { background: #10b981; color: #fff; }
      .btn-delivered { background: #111827; color: #fff; }
      .btn:hover { opacity: 0.9; }
      .empty { text-align: center; padding: 4rem 1rem; color: #9ca3af; }
      .empty p { font-size: 1rem; margin-bottom: 0.5rem; }
      .refresh { text-align: center; font-size: 0.7rem; color: #9ca3af; margin-top: 1rem; }
    </style>
  </head>
  <body>
    <div class="header">
      <h1>🛵 Delivery Dashboard</h1>
      <a href="/admin.html">Admin →</a>
    </div>

    <div class="container">
      <div id="delivery-list"></div>
      <p class="refresh">Auto-refreshes every 3 seconds</p>
    </div>

    <script type="module">
      import { createClient } from "https://esm.sh/@supabase/supabase-js@2";
      const supabase = createClient(
        "https://lkjqnnjzxjyddtwobmrg.supabase.co",
        "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxranFubmp6eGp5ZGR0d29ibXJnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODcxNDQzMDEsImV4cCI6MjEwMjcyMDMwMX0.cA-f1ZCmtehW3Zo4psUpXrNMoK2sQRWhJfmngqpYLyk"
      );

      let ordersCache = [];

      async function fetchOrders() {
        const { data, error } = await supabase.from("orders").select("*").order("created_at", { ascending: false });
        if (error || !data) return [];
        ordersCache = data.map(o => ({
          id: o.id,
          items: o.items || [],
          user: o.user_info || { name: "", phone: "", address: "", lat: null, lng: null },
          total: o.total || 0,
          status: o.status || "Placed",
          time: o.created_at
        }));
        return ordersCache;
      }

      async function updateStatus(orderId, status) {
        const order = ordersCache.find(o => o.id === orderId);
        if (order) order.status = status;
        await supabase.from("orders").update({ status }).eq("id", orderId);
        render();
      }
      window.updateStatus = updateStatus;

      function openMapForOrder(orderId) {
        const order = ordersCache.find(o => o.id === orderId);
        if (!order) return;
        let destination;
        // 1. Use lat/lng if present
        if (order.user.lat && order.user.lng) {
          destination = order.user.lat + "," + order.user.lng;
        } else {
          // 2. Try to extract coords from address text like "Map Pin (13.70398, 80.02945)"
          const addr = order.user.address || "";
          const match = addr.match(/\(?\s*(-?\d+\.\d+)\s*,\s*(-?\d+\.\d+)\s*\)?/);
          if (match) {
            destination = match[1] + "," + match[2];
          } else {
            // 3. Fallback to address text search
            destination = encodeURIComponent(addr + ", Sullurpeta");
          }
        }
        window.location.href = "https://www.google.com/maps/dir/?api=1&destination=" + destination + "&travelmode=driving&dir_action=navigate";
      }
      window.openMapForOrder = openMapForOrder;

      async function render() {
        await fetchOrders();
        const deliveryOrders = ordersCache.filter(o => o.status === "Preparing" || o.status === "Out for Delivery");
        const container = document.getElementById("delivery-list");

        if (deliveryOrders.length === 0) {
          container.innerHTML = '<div class="empty"><p>No deliveries right now</p><span style="font-size:0.8rem;">Orders will appear here when ready for delivery</span></div>';
          return;
        }

        container.innerHTML = "";
        deliveryOrders.forEach(order => {
          const isPreparing = order.status === "Preparing";
          const div = document.createElement("div");
          div.className = "order-card";
          div.innerHTML = `
            <div class="order-header">
              <span class="order-id">${order.id}</span>
              <span class="status ${isPreparing ? 'status-preparing' : 'status-out'}">${order.status}</span>
            </div>
            <div class="order-body">
              <div class="customer-name">${order.user.name || "Customer"}</div>
              <div class="customer-phone">
                <a href="tel:+91${order.user.phone}">${order.user.phone || "N/A"}</a>
              </div>
              <div class="address">
                ${order.user.address || "No address provided"}
              </div>
              <div class="items">
                ${order.items.map(i => i.name + " x" + i.qty).join(", ")}
              </div>
              <div class="total">Total: Rs.${order.total + 30}</div>
              <div class="actions">
                <button class="btn btn-map" onclick="openMapForOrder('${order.id}')">Navigate</button>
                <a href="tel:+91${order.user.phone}" class="btn btn-call">Call</a>
                ${order.status === "Preparing" ? `<button class="btn btn-delivered" onclick="updateStatus('${order.id}', 'Out for Delivery')">Picked Up</button>` : ''}
                ${order.status === "Out for Delivery" ? `<button class="btn btn-delivered" onclick="updateStatus('${order.id}', 'Delivered')">Delivered</button>` : ''}
              </div>
            </div>
          `;
          container.appendChild(div);
        });
      }

      render();
      setInterval(render, 3000);
    </script>
  </body>
</html>
