<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Orders - Al Sheeri's</title>
    <link rel="stylesheet" href="/src/style.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
  </head>
  <body class="bg-gray-50 text-gray-900 font-sans">
    <header class="sticky top-0 z-50 bg-white shadow-sm">
      <div class="max-w-3xl mx-auto px-4 py-3 flex items-center gap-4">
        <a href="/index.html" class="flex items-center gap-2 text-sm font-medium text-gray-700 hover:text-orange-500">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"/>
          </svg>
        </a>
        <h1 class="text-lg font-bold">My Orders</h1>
      </div>
    </header>

    <div class="max-w-3xl mx-auto px-4 py-6">
      <div id="no-orders" class="hidden text-center py-16">
        <p class="text-gray-500 text-lg">No orders yet</p>
        <a href="/index.html" class="inline-block mt-4 bg-orange-500 text-white px-6 py-2.5 rounded-lg font-medium hover:bg-orange-600">Order Now</a>
      </div>
      <div id="orders-list" class="space-y-4"></div>
    </div>

    <script type="module">
      import { getOrders } from "/src/data.js";

      // Auth check
      if (!localStorage.getItem("alsheeri_user")) {
        window.location.href = "/login.html";
      }

      function render() {
        const orders = getOrders().reverse();
        const noOrders = document.getElementById("no-orders");
        const list = document.getElementById("orders-list");

        if (orders.length === 0) {
          noOrders.classList.remove("hidden");
          return;
        }

        noOrders.classList.add("hidden");
        list.innerHTML = "";

        const statusColors = {
          "Placed": "bg-yellow-100 text-yellow-800",
          "Preparing": "bg-blue-100 text-blue-800",
          "Out for Delivery": "bg-purple-100 text-purple-800",
          "Delivered": "bg-green-100 text-green-800",
          "Cancelled": "bg-red-100 text-red-800"
        };

        orders.forEach(order => {
          const date = new Date(order.time);
          const div = document.createElement("div");
          div.className = "bg-white rounded-xl border p-4";
          div.innerHTML = `
            <div class="flex items-center justify-between mb-3">
              <div>
                <p class="font-bold text-sm">${order.id}</p>
                <p class="text-xs text-gray-500">${date.toLocaleDateString("en-IN")} at ${date.toLocaleTimeString("en-IN", { hour: "2-digit", minute: "2-digit" })}</p>
              </div>
              <span class="text-xs font-semibold px-2.5 py-1 rounded-full ${statusColors[order.status] || 'bg-gray-100 text-gray-800'}">${order.status}</span>
            </div>
            <div class="divide-y">
              ${order.items.map(item => `
                <div class="py-2 flex justify-between text-sm">
                  <span>${item.name} x ${item.qty}</span>
                  <span class="text-gray-600">₹${item.price * item.qty}</span>
                </div>
              `).join("")}
            </div>
            <div class="flex justify-between mt-3 pt-3 border-t font-bold text-sm">
              <span>Total</span>
              <span>₹${order.total + 30}</span>
            </div>
          `;
          list.appendChild(div);
        });
      }

      render();
      // Auto-refresh every 5 seconds to see status updates from admin
      setInterval(render, 5000);
    </script>
  </body>
</html>
